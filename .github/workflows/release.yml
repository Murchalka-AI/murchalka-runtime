name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  publish:
    name: Publish Runtime and GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Validate and extract tag version
        id: version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use SemVer format vX.Y.Z or vX.Y.Z-prerelease." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: >-
          dotnet nuget update source murchalka
          --username "${GITHUB_ACTOR}"
          --password "${PACKAGE_TOKEN}"
          --store-password-in-clear-text
          --configfile NuGet.Config

      - name: Restore dependencies
        run: dotnet restore Murchalka.Runtime.slnx --configfile NuGet.Config

      - name: Build release
        run: >-
          dotnet build Murchalka.Runtime.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}

      - name: Test release
        run: dotnet test --solution Murchalka.Runtime.slnx --configuration Release --no-build --no-restore

      - name: Publish portable Runtime
        run: >-
          dotnet publish src/Murchalka.Runtime.Host/Murchalka.Runtime.Host.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/publish
          -p:UseAppHost=false
          -p:Version=${{ steps.version.outputs.value }}

      - name: Smoke-test published Runtime
        shell: bash
        run: |
          runtime_root="${RUNNER_TEMP}/murchalka-runtime"
          dotnet artifacts/publish/Murchalka.Runtime.Host.dll \
            --root "${runtime_root}" \
            --url http://127.0.0.1:5078 &
          runtime_pid=$!
          trap 'kill "${runtime_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5078/health | grep --quiet '"status":"ready"'; then
              exit 0
            fi
            sleep 1
          done

          echo "Published Runtime did not become healthy." >&2
          exit 1

      - name: Create release archives and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          release_name="murchalka-runtime-${RELEASE_VERSION}"
          release_root="artifacts/release/${release_name}"
          mkdir -p "${release_root}/docs/operations"
          cp -R artifacts/publish/. "${release_root}/"
          cp README.md SECURITY.md "${release_root}/"
          cp docs/operations/phase1-runbook.md "${release_root}/docs/operations/"
          cp docs/operations/phase2-runbook.md "${release_root}/docs/operations/"

          tar -C artifacts/release -czf "artifacts/release/${release_name}.tar.gz" "${release_name}"
          (
            cd artifacts/release
            zip -qr "${release_name}.zip" "${release_name}"
            sha256sum "${release_name}.tar.gz" "${release_name}.zip" > SHA256SUMS
          )

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-release-${{ steps.version.outputs.value }}
          path: |
            artifacts/release/*.tar.gz
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/release/*.tar.gz
            artifacts/release/*.zip

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Reject an existing immutable image tag
        shell: bash
        run: |
          image="ghcr.io/murchalka-ai/murchalka-runtime:${{ steps.version.outputs.value }}"
          if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
            echo "Container image tag already exists and remains immutable." >&2
            exit 1
          fi

      - name: Publish Runtime container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/murchalka-ai/murchalka-runtime:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            NUGET_USERNAME=${{ github.actor }}
          secrets: |
            nuget_token=${{ github.token }}
          provenance: mode=max
          sbom: true

      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          assets=(artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists and must remain immutable." >&2
            exit 1
          fi

          args=(--verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create \
            "${GITHUB_REF_NAME}" \
            "${assets[@]}" \
            "${args[@]}" \
            --repo "${GITHUB_REPOSITORY}"
